<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c39">
  <meta name="description" content="Uma carta especial para AneClew.">
  <title>Para minha pessoa favorita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root{--night:#101c39;--blue:#253d68;--gold:#f4d58b;--ink:#39251f;--wine:#7e202d;--paper:#f4e5c8}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#344b76 0%,#172746 48%,#091326 100%);color:#f8efd9;font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden}
    .sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
    .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3c8;box-shadow:0 0 10px 3px #f6d99188;animation:twinkle 3s ease-in-out infinite alternate}
    .lantern{position:absolute;bottom:-90px;width:19px;height:29px;border-radius:45% 45% 38% 38%;background:linear-gradient(90deg,#c88637,#ffe9a4 48%,#c88637);box-shadow:0 0 22px 8px #ffd47b66;opacity:.8;animation:floatUp linear infinite}
    .lantern:before{content:"";position:absolute;left:8px;top:-8px;width:3px;height:8px;border:1px solid #e6c57e;border-bottom:0;border-radius:50% 50% 0 0}
    @keyframes floatUp{from{transform:translateY(0) translateX(0) rotate(-4deg);opacity:0}12%{opacity:.85}to{transform:translateY(-115vh) translateX(35px) rotate(7deg);opacity:0}}
    @keyframes twinkle{from{opacity:.25;transform:scale(.7)}to{opacity:1;transform:scale(1.25)}}
    .intro{position:relative;z-index:2;min-height:100svh;display:grid;place-items:center;padding:28px 18px;text-align:center;transition:opacity .8s ease,transform .8s ease}
    .intro.hide{opacity:0;transform:scale(1.04);pointer-events:none;position:absolute;inset:0}
    .intro-note{font-size:clamp(13px,3vw,17px);letter-spacing:.24em;text-transform:uppercase;color:#e7d5ac;margin-bottom:24px}
    .intro h1{font-size:clamp(37px,9vw,60px);font-weight:500;line-height:1.02;margin:0 0 13px;color:#fff1d3;text-shadow:0 2px 22px #080e1c}
    .intro p{font-size:20px;color:#d9d8e0;margin:0 0 32px}
    .envelope-button{border:0;background:none;padding:0;cursor:pointer;color:inherit;display:grid;justify-items:center;gap:19px; -webkit-tap-highlight-color:transparent}
    .envelope{width:min(74vw,310px);aspect-ratio:1.48;position:relative;filter:drop-shadow(0 16px 25px #050b18aa);transition:transform .35s ease}
    .envelope-button:active .envelope{transform:scale(.97)}
    .env-back{position:absolute;inset:0;background:#d8bd91;border-radius:8px;box-shadow:inset 0 0 0 1px #f2dfb9}
    .env-front{position:absolute;inset:0;background:linear-gradient(145deg,#a33b43,#6e1c2b);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:7px}
    .env-flap{position:absolute;inset:0;background:linear-gradient(145deg,#b94c50,#812331);clip-path:polygon(0 0,100% 0,50% 65%);transform-origin:top;transition:transform .9s ease;z-index:3}
    .seal{position:absolute;z-index:4;left:50%;top:57%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9bd76,#a65a34 70%);display:grid;place-items:center;color:#fff0c8;font-size:24px;box-shadow:0 3px 8px #40121c88}
    .envelope.open .env-flap{transform:rotateX(180deg);z-index:1}
    .envelope.open .seal{opacity:0;transition:opacity .2s}
    .tap-hint{font-size:15px;letter-spacing:.13em;color:#f2dfb9;text-transform:uppercase}
    .letter-wrap{position:relative;z-index:1;max-width:780px;width:100%;margin:0 auto;padding:30px 16px 125px;opacity:0;transform:translateY(22px);transition:opacity 1s ease,transform 1s ease;pointer-events:none}
    .letter-wrap.show{opacity:1;transform:none;pointer-events:auto}
    .letter{position:relative;isolation:isolate;color:var(--ink);padding:clamp(27px,6vw,58px) clamp(21px,6vw,62px) 45px;background:#e8d4ae url('assets/papel-fundo.jpeg') center center/cover no-repeat;border:1px solid #d2b98d;box-shadow:0 22px 65px #03091699,0 0 0 7px #d5bb8b22;border-radius:3px;overflow:hidden}
    .letter:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#f0dfbdcc,#f4e5c8df 48%,#f1dfbdcc);backdrop-filter:blur(1px)}
    .letter:after{content:"";position:absolute;inset:10px;border:1px solid #9a755544;pointer-events:none}
    .letter-kicker{text-align:center;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:#865a46;margin:0 0 9px}
    .letter h2{text-align:center;font-size:clamp(31px,7vw,49px);font-weight:500;line-height:1.05;margin:0 0 9px;color:#6f2931}
    .ornament{text-align:center;color:#9b6d42;font-size:20px;letter-spacing:.4em;margin:0 0 27px}
    .letter-body{font-size:clamp(19px,4.7vw,23px);line-height:1.48;min-height:200px;white-space:pre-line}
    .letter-body p{margin:0 0 17px}
    .typed-cursor{display:inline-block;width:1px;height:1em;background:#6f2931;margin-left:2px;vertical-align:-2px;animation:blink .8s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
    .memory-photo{float:right;width:min(43%,230px);margin:5px 0 18px 19px;padding:8px 8px 24px;background:#f8f0df;box-shadow:0 5px 15px #4d332b44;transform:rotate(2.2deg);position:relative;z-index:1}
    .memory-photo img{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover}
    .photo-caption{text-align:center;color:#76554b;font-size:14px;margin-top:7px;font-style:italic}
    .signature{clear:both;text-align:right;padding-top:18px;color:#6f2931}
    .signature .forever{font-size:19px;margin:0 0 3px}
    .signature .name{font-family:'Great Vibes',cursive;font-size:43px;line-height:1.15;margin:0}
    .lily-row{display:flex;justify-content:center;align-items:center;gap:14px;margin:28px 0 0;color:#58718d}
    .lily{width:44px;height:44px;opacity:.88}
    .lily path{fill:#f4f0e3;stroke:#647d9a;stroke-width:1.5;stroke-linejoin:round}
    .lily .stem{fill:none;stroke:#637d65;stroke-width:2}
    .music-player{position:fixed;z-index:5;left:50%;bottom:max(13px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,520px);display:flex;align-items:center;gap:12px;padding:11px 15px;background:#101b34eF;border:1px solid #d9bb7b66;border-radius:18px;box-shadow:0 10px 35px #02081788;backdrop-filter:blur(12px)}
    .play{width:39px;height:39px;flex:0 0 39px;border:1px solid #d9bd83;border-radius:50%;background:#9b6a3c;color:#fff2d3;font-size:16px;cursor:pointer}
    .track{min-width:0;flex:1}
    .track-title{font-size:14px;color:#f4e7cb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
    .progress-row{display:flex;align-items:center;gap:8px;color:#d9cba9;font:11px Arial,sans-serif}
    input[type=range]{width:100%;height:3px;accent-color:#e5c17c;cursor:pointer}
    .time{font-variant-numeric:tabular-nums;white-space:nowrap}
    .footer-note{text-align:center;color:#d6c69f;font-size:15px;margin:22px 0 0}
    @media(max-width:420px){.letter-wrap{padding:20px 10px 118px}.letter{padding:27px 19px 34px}.memory-photo{width:42%;margin-left:13px}.letter-body{font-size:19px;line-height:1.43}.memory-photo{padding:6px 6px 19px}.photo-caption{font-size:12px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"></div>
  <main>
    <section class="intro" id="intro">
      <div>
        <div class="intro-note">Uma pequena surpresa para você</div>
        <h1>Para minha<br>pessoa favorita</h1>
        <p>Com carinho, do seu WhatGuinho.</p>
        <button class="envelope-button" id="openLetter" aria-label="Abrir minha carta">
          <span class="envelope" id="envelope">
            <span class="env-back"></span><span class="env-front"></span><span class="env-flap"></span><span class="seal">♡</span>
          </span>
          <span class="tap-hint">Toque para abrir sua carta</span>
        </button>
      </div>
    </section>

    <section class="letter-wrap" id="letterWrap" aria-label="Carta para AneClew">
      <article class="letter">
        <p class="letter-kicker">Escrita especialmente para você</p>
        <h2>Para minha pessoa favorita</h2>
        <div class="ornament">✦ ❧ ✦</div>
        <div class="letter-body" id="letterBody" aria-live="polite"></div>
        <div class="signature" id="signature" hidden>
          <p class="forever">Para sempre,</p>
          <p class="name">WhatGuinho</p>
        </div>
        <div class="lily-row" aria-label="Lírios">
          <svg class="lily" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 30C7 22 13 7 25 19C25 2 39 4 35 22C51 8 57 22 39 31C55 39 45 52 31 39C24 57 10 48 24 34Z"/><path class="stem" d="M30 34Q28 48 17 56M30 42Q39 46 46 54"/><path d="M29 30l-2-8m5 9 8-7m-10 9 10 2" fill="none" stroke="#b58a43" stroke-width="1.4"/></svg>
          <svg class="lily" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 30C7 22 13 7 25 19C25 2 39 4 35 22C51 8 57 22 39 31C55 39 45 52 31 39C24 57 10 48 24 34Z"/><path class="stem" d="M30 34Q28 48 17 56M30 42Q39 46 46 54"/><path d="M29 30l-2-8m5 9 8-7m-10 9 10 2" fill="none" stroke="#b58a43" stroke-width="1.4"/></svg>
        </div>
      </article>
      <p class="footer-note">Que sempre existam luzes para encontrar o caminho de volta um ao outro. ✨</p>
    </section>
  </main>

  <audio id="music" src="assets/trilha.mp3" preload="metadata" loop></audio>
  <div class="music-player" aria-label="Controles da música">
    <button class="play" id="playPause" aria-label="Reproduzir música" title="Reproduzir ou pausar">▶</button>
    <div class="track">
      <div class="track-title">Nossa trilha sonora ♡</div>
      <div class="progress-row"><span class="time" id="currentTime">0:00</span><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Progresso da música"><span class="time" id="duration">0:00</span></div>
    </div>
  </div>

  <script>
    const sky=document.getElementById('sky');
    for(let i=0;i<34;i++){
      const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*4)+'s';s.style.opacity=.25+Math.random()*.7;sky.appendChild(s);
    }
    for(let i=0;i<9;i++){
      const l=document.createElement('i');l.className='lantern';l.style.left=(5+Math.random()*90)+'%';l.style.animationDuration=(19+Math.random()*18)+'s';l.style.animationDelay=(-Math.random()*30)+'s';l.style.transform=`scale(${.55+Math.random()*.7})`;sky.appendChild(l);
    }
    const intro=document.getElementById('intro'), envelope=document.getElementById('envelope'), wrap=document.getElementById('letterWrap');
    const audio=document.getElementById('music'), playBtn=document.getElementById('playPause'), seek=document.getElementById('seek');
    const current=document.getElementById('currentTime'), duration=document.getElementById('duration');
    const letterBody=document.getElementById('letterBody'), signature=document.getElementById('signature');
    const paragraphs=[
      'Alou, alou, AneClew.',
      'Você ficou nos meus pensamentos essa madrugada inteira. Parece loucura, mas eu realmente não sei mais o que é viver sem você. Obviamente, penso demais e me sinto mal por coisas que não estão sob meu controle, mas queria deixar claro que isso não tem nada a ver com você. Inclusive, você nem precisa se esforçar para ser exatamente o que eu sempre quis.',
      'Sinto que não tenho sido um bom namorado nesses últimos dias, porém, eu te amo e amo tudo em você: a mania de rir de tudo, as pintas sexys, seu cabelo cacheado, seus olhos que brilham, o fato de você gostar de ficar acordada de madrugada, o fato de sempre me ajudar em casa e o fato de que, por mais que a gente brigue, você nunca tenha desistido de nós…',
      'Eu te amo, AneClew, e ainda te olho da mesma forma que te olhei desde a primeira vez que te vi. Você é incrível.',
      'Para sempre, minha princesa Patrick Estrela.'
    ];
    const photoHTML='<figure class="memory-photo"><img src="assets/foto-casal.jpeg" alt="Uma foto especial de vocês dois"><figcaption class="photo-caption">um pedacinho do nosso mundo</figcaption></figure>';
    const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const wait=ms=>new Promise(r=>setTimeout(r,ms));
    async function typeLetter(){
      letterBody.innerHTML=photoHTML+'<span id="typed"></span><span class="typed-cursor"></span>';
      const target=document.getElementById('typed');
      for(let p=0;p<paragraphs.length;p++){
        if(p>0) target.appendChild(document.createElement('br'));
        const para=document.createElement('p');target.appendChild(para);
        for(const ch of paragraphs[p]){para.textContent+=ch;await wait(ch===' '?24:34);}
        await wait(360);
      }
      letterBody.querySelector('.typed-cursor')?.remove();signature.hidden=false;
    }
    document.getElementById('openLetter').addEventListener('click',async()=>{
      document.getElementById('openLetter').disabled=true;envelope.classList.add('open');
      try{await audio.play();playBtn.textContent='Ⅱ';playBtn.setAttribute('aria-label','Pausar música');}catch(e){playBtn.textContent='▶';}
      await wait(650);intro.classList.add('hide');wrap.classList.add('show');setTimeout(typeLetter,650);
      setTimeout(()=>wrap.scrollIntoView({behavior:'smooth',block:'start'}),700);
    });
    function fmt(t){if(!Number.isFinite(t))return '0:00';return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');}
    audio.addEventListener('loadedmetadata',()=>{duration.textContent=fmt(audio.duration);});
    audio.addEventListener('timeupdate',()=>{current.textContent=fmt(audio.currentTime);if(Number.isFinite(audio.duration)&&audio.duration>0)seek.value=audio.currentTime/audio.duration*100;});
    audio.addEventListener('play',()=>{playBtn.textContent='Ⅱ';playBtn.setAttribute('aria-label','Pausar música');});
    audio.addEventListener('pause',()=>{playBtn.textContent='▶';playBtn.setAttribute('aria-label','Reproduzir música');});
    playBtn.addEventListener('click',async()=>{if(audio.paused){try{await audio.play()}catch(e){playBtn.textContent='▶'}}else audio.pause();});
    seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration))audio.currentTime=(Number(seek.value)/100)*audio.duration;});
  </script>
</body>
</html>
